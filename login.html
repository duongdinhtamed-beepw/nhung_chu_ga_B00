<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https: blob:; worker-src 'self' blob:;">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Đăng nhập - B00 Study Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-bg">
        <div class="bg-blob blob1"></div>
        <div class="bg-blob blob2"></div>
        <div class="bg-blob blob3"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
                <h1>B00 Study Hub</h1>
                <p>Hệ thống ôn thi tổ hợp Toán - Hóa - Sinh</p>
            </div>

            <form id="loginForm" class="login-form" autocomplete="off" novalidate>
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" required
                               maxlength="32" autocomplete="username"
                               pattern="[a-zA-Z0-9_]+"
                               placeholder="student01">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required
                               maxlength="128" autocomplete="current-password"
                               placeholder="••••••••••••">
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Hiện mật khẩu">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-error" id="formError" role="alert"></div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span>Đăng nhập</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="security-badges">
                <div class="badge-item"><i class="fas fa-shield-halved"></i> PBKDF2</div>
                <div class="badge-item"><i class="fas fa-lock"></i> AES-GCM</div>
                <div class="badge-item"><i class="fas fa-fingerprint"></i> Session bind</div>
                <div class="badge-item"><i class="fas fa-gauge-high"></i> Rate-limit</div>
            </div>

            <div class="login-footer">
                <p>Bạn cần tài khoản? Liên hệ quản trị viên.</p>
            </div>
        </div>
    </div>

    <script src="security.js"></script>
    <script src="auth.js"></script>
    <script>
        // Redirect if already logged in
        (async () => {
            const s = await AuthModule.verifySession();
            if (s) location.replace('index.html');
        })();

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('formError');
        const btn = document.getElementById('btnLogin');
        const togglePw = document.getElementById('togglePw');
        const pwInput = document.getElementById('password');

        togglePw.addEventListener('click', () => {
            const isPw = pwInput.type === 'password';
            pwInput.type = isPw ? 'text' : 'password';
            togglePw.querySelector('i').className = isPw ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            btn.disabled = true;
            btn.querySelector('span').textContent = 'Đang xác thực...';
            try {
                const u = form.username.value.trim();
                const p = form.password.value;
                await AuthModule.login(u, p);
                btn.querySelector('span').textContent = 'Thành công!';
                setTimeout(() => location.replace('index.html'), 300);
            } catch (err) {
                errorEl.textContent = err.message;
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Đăng nhập';
                // Clear password on failure
                pwInput.value = '';
            }
        });

        // Prevent form autofill attacks + paste-jack
        document.addEventListener('copy', (e) => {
            if (e.target === pwInput) e.preventDefault();
        });
    </script>
</body>
</html>
